<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#121a2f"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#bg)" />
  <circle cx="200" cy="200" r="120" stroke="url(#gold)" stroke-width="4" fill="none" opacity="0.6" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="90" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="10 15" fill="none"/>
  <text x="200" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="54" fill="#FFD700">⏳</text>
  <text x="380" y="160" font-family="system-ui, sans-serif" font-weight="800" font-size="46" fill="#FFFFFF">Time-Travel Debugger MCP</text>
  <text x="380" y="210" font-family="system-ui, sans-serif" font-weight="500" font-size="22" fill="#00F2FE">SQLite Shadow Snapshot &amp; Instant Rollback Engine</text>
  <text x="380" y="260" font-family="system-ui, sans-serif" font-weight="400" font-size="16" fill="#A0AEC0">Take 1ms pre-edit checkpoints • Inspect unified diffs • Instant rollback without Git</text>
  <rect x="380" y="290" width="140" height="36" rx="18" fill="url(#gold)"/>
  <text x="450" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#0A0F1D">v1.2.0 READY</text>
  <rect x="535" y="290" width="160" height="36" rx="18" fill="none" stroke="url(#cyan)" stroke-width="2"/>
  <text x="615" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#00F2FE">MCP SERVER</text>
</svg>
